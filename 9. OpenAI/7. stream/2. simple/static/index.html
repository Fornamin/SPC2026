<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
        .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 1.5rem; }
        h1 { font-size: 20px; font-weight: 500; }
        .input-row { display: flex; gap: 10px; }
        .input-row input { flex: 1; height: 40px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; padding: 0 14px; outline: none; }
        .input-row input:focus { border-color: #aaa; }
        .input-row button { height: 40px; padding: 0 18px; border-radius: 8px; border: 1px solid #ddd; background: white; font-size: 14px; cursor: pointer; }
        .input-row button:hover { background: #f0f0f0; }
        #chat { background: white; border: 1px solid #eee; border-radius: 12px; min-height: 240px; max-height: 480px; overflow-y: auto; padding: 1.25rem; font-size: 15px; line-height: 1.7; }
        #chat pre { background: #111; color: white; border-radius: 8px; padding: 12px 16px; overflow-x: auto; margin: 0.75rem 0; }
        #chat code { font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Streaming Chat</h1>
        <div class="input-row">
            <input type="text" id="msg" placeholder="메시지를 입력하세요..." />
            <button id="sendBtn">전송</button>
        </div>
        <div id="chat"></div>
    </div>
    <script>
        const input = document.getElementById('msg');
        const sendBtn = document.getElementById('sendBtn');
        const chat = document.getElementById('chat');

        sendBtn.addEventListener('click', async () => {
            const msg = input.value.trim();
            if (!msg) return;

            const res = await fetch('/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ msg })
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value, { stream: true });
                if (chunk.trim() === 'data: [DONE]' || chunk.trim() === '[DONE]') continue;
                fullText += chunk;
                chat.innerHTML = marked.parse(fullText);
                chat.scrollTop = chat.scrollHeight;
            }
        });

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
