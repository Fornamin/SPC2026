<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPC 작명소</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4ecff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #333;
            font-size: 32px;
        }

        .sub {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #dbe3ff;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #5b7fff;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 12px;
            background: #5b7fff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover:not(:disabled) {
            background: #4166f5;
        }

        button:disabled {
            background: #b8c5ff;
            cursor: not-allowed;
        }

        .progress-wrapper {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #5b7fff, #7ea1ff);
            animation: loading 1s infinite linear;
            transform-origin: left;
        }

        @keyframes loading {
            0% {
                transform: scaleX(0);
                opacity: 0.5;
            }

            50% {
                transform: scaleX(1);
                opacity: 1;
            }

            100% {
                transform: scaleX(0);
                opacity: 0.5;
            }
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: #f8faff;
            border-radius: 16px;
            min-height: 120px;
        }

        .result-box h2 {
            margin-top: 0;
            color: #444;
        }

        #resultList {
            padding-left: 20px;
            color: #333;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>✨ SPC 작명소</h1>
        <p class="sub">상품명을 입력하면 AI가 회사 이름을 추천해드립니다.</p>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="예: 초코 크루아상">
            <button id="sendBtn">이름 생성</button>
        </div>

        <!-- Progress -->
        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>

        <!-- Result -->
        <div class="result-box">
            <h2>결과</h2>
            <div id="resultList"></div>
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const input = document.getElementById('userInput');
        const progressWrapper = document.getElementById('progressWrapper');
        const result = document.getElementById('resultList');

        sendBtn.addEventListener('click', async () => {
            if (!input.value.trim()) {
                alert('상품명을 입력해주세요.');
                return;
            }

            // 버튼 비활성화 + 로딩 표시
            sendBtn.disabled = true;
            sendBtn.innerText = '생성 중...';
            progressWrapper.style.display = 'block';

            result.innerHTML = '';

            try {
                const res = await fetch('/api/name', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        product: input.value
                    })
                });

                const data = await res.json();

                result.innerHTML = marked.parse(data.chatbot);

            } catch (err) {
                result.innerHTML = `
                    <p style="color:red;">
                        오류가 발생했습니다 😢
                    </p>
                `;
                console.error(err);

            } finally {
                // 버튼 활성화 + 로딩 제거
                sendBtn.disabled = false;
                sendBtn.innerText = '이름 생성';
                progressWrapper.style.display = 'none';
            }
        });
    </script>

</body>

</html>
